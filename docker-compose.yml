version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nextjs_frontend
    restart: unless-stopped
    ports:
      - "7778:7778"
    environment:
      NODE_ENV: "production"
      PORT: "7778"
      NEXT_PUBLIC_API_URL: "https://office.oo4.me"
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
